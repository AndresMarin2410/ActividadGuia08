<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/formulario.css">
    <script src="/scripts/funciones.js" defer></script>
    <title>Formulario Panaderia El Trigal</title>
</head>
<body>

    <header>
        <div class="logo-titulo">
            <img src="/images/portapapeles.png" class="logo-formulario" alt="logo-formulario">
            <h1>Formulario</h1>
        </div>
    </header>
    <main>

        <form id="formulario" novalidate>
            <label for="nombre-completo">Nombre:</label>
            <input type="text" id="nombre-completo" placeholder="Nombre completo" required>


            <label for="correo">Correo:</label>
            <input type="email" id="correo" placeholder="ejemplo@correo.cl" required>

            <label for="telefono">Telefono:</label>
            <input type="text" id="telefono" placeholder="912345678">

            <label for="tipo-consulta">Tipo de consulta</label>
            <select  id="tipo-consulta" required>
                <option value="">Tipo consulta</option>
                <option>Consulta general</option>
                <option>Pedido especial</option>
                <option>Reclamo</option>
                <option>Otro</option>
            </select>

            <label for="Mensaje">Mensaje:</label>
            <textarea  id="mensaje" rows="2" required></textarea>

            <button type="submit">Enviar consulta</button>
            <p id="mensaje-confirmacion"></p>
        </form>
    </main>

    <footer>

    </footer>
    
</body>
</html>
